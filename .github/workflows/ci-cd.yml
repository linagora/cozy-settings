name: CI/CD

on:
  pull_request:
  push:
    branches:
      - master
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+'

permissions:
  contents: read

jobs:
  build:
    uses: linagora/twake-workflows/.github/workflows/build-and-publish-cozy-app.yml@c6f6a4de61671a4e5d440d138c5544e4233b58c7 # v1.7.0
    with:
      mattermost-channel: '{"dev":"app---settings","beta":"app---settings,publication","stable":"app---settings,publication"}'
    secrets:
      REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
      DOWNCLOUD_SSH_KEY: ${{ secrets.DOWNCLOUD_SSH_KEY }}
      MATTERMOST_HOOK_URL: ${{ secrets.MATTERMOST_HOOK_URL }}
